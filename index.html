<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest.json">
    <title>Visualização de Emissões CO2</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="loading-indicator" class="loading-overlay">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Carregando dados globais...</p>
        </div>
    </div>

    <div class="header">
        <h1>Monitor de Emissões Globais (1750-2021)</h1>
        <div class="controls">
            <button id="playButton">PLAY</button>
            <label for="yearSlider">Ano</label>
            <input type="range" id="yearSlider" min="1750" max="2021" value="2021">
            <span id="yearValue" class="year-value">2021</span>
        </div>
    </div>

    <div class="app-layout">
        <main class="dashboard-main">
            <div class="dashboard-grid">
                <div id="chart-container" class="card">
                    <div class="card-title">Distribuição Espacial (Where)</div>
                    <div id="map-legend" class="legend-container"></div>
                </div>
                <div id="scatter-plot-container" class="card">
                    <div class="card-title">Correlação: Acumulado vs. Tendência Atual (What)</div>
                </div>
                <div id="line-chart-container" class="card">
                    <div class="card-title">Evolução Temporal: <span id="countryName">USA</span> (When)</div>
                </div>
                <div id="bar-chart-container" class="card">
                    <div class="card-title">Ranking de Impacto (Who)</div>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <section class="sidebar-card">
                <div class="filter-group">
                    <label for="countrySelect">Comparação multi-país</label>
                    <select id="countrySelect" multiple aria-label="Selecionar países" title="Segure Ctrl/Cmd para múltiplas seleções"></select>
                    <button id="applyCountrySelection">Aplicar seleção</button>
                </div>
            </section>
            <section class="sidebar-card">
                <div class="filter-group">
                    <label>Presets de ano</label>
                    <div class="preset-buttons">
                        <button type="button" data-preset-year="1800">1800</button>
                        <button type="button" data-preset-year="1950">1950</button>
                        <button type="button" data-preset-year="2000">2000</button>
                        <button type="button" data-preset-year="2021">2021</button>
                    </div>
                </div>
            </section>
            <section class="sidebar-card">
                <div class="filter-group">
                    <label>Exportações</label>
                    <button id="exportPngBtn" type="button">Exportar PNG</button>
                    <button id="exportCsvBtn" type="button">Exportar CSV séries</button>
                    <button id="exportYearCsvBtn" type="button">Exportar CSV ano</button>
                </div>
            </section>
        </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
